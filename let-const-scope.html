<script>
let output = '';
if (true) {
  let blockScoped = 'I only exist inside this block';
  const alsoBlockScoped = 'Me too';
  output += 'Inside block: ' + blockScoped + '\n';
}
try {
  // blockScoped is not accessible here - this would throw a ReferenceError
  output += 'Outside block, blockScoped is: ' + (typeof blockScoped !== 'undefined' ? blockScoped : 'not accessible (as expected)');
} catch (e) {

}
