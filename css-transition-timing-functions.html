<!DOCTYPE html>

<head>

<title>Transition Timing Functions</title>
<link rel="stylesheet" href="../assets/style.css">
<style>
.tf-row { display: flex; gap: 10px; flex-wrap: wrap; } .tf-btn { padding: 10px 14px; transition: transform 0.6s; } .t-linear { transition-timing-function: linear; } .t-ease { transition-timing-function: ease; } .t-in { transition-timing-function: ease-in; } .t-out { transition-timing-function: ease-out; } .t-inout { transition-timing-function: ease-in-out; } .tf-btn:hover { transform: translateX(40px); }
</style>
</head>
<body>

  <header class="site-header"><h1>CSS Programs</h1></header>

  <main>
    <div class="program-page">
      <h1>52. Transition Timing Functions</h1>
      <p class="description">Demonstrates different easing curves: linear, ease, ease-in, ease-out and ease-in-out.</p>

      <div class="demo-area">
<div class="tf-row"><button class="tf-btn t-linear">linear</button><button class="tf-btn t-ease">ease</button><button class="tf-btn t-in">ease-in</button><button class="tf-btn t-out">ease-out</button><button class="tf-btn t-inout">ease-in-out</button></div><p style="color:var(--muted); margin-top:10px;">Hover each button to feel the difference in movement speed curve.</p>
      </div>

      <div class="nav-links">
        <a href="../index.html">Home</a>
        <a class="secondary" href="index.html">Back to CSS Programs</a>
      </div>
    </div>

  <footer>CSS Programs &mdash; Program 52</footer>

</body>
</html>
