<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Length Unit Converter</title>
<link rel="stylesheet" href="../assets/style.css">

</head>
<body>

  <header class="site-header"><h1>JavaScript Programs</h1></header>

  <main>
    <div class="program-page">
      <h1>11. Length Unit Converter</h1>
      <p class="description">Converts a length value between meters, kilometers, feet and miles using conversion factors.</p>

      <div class="demo-area">
<div class="demo-form"><label for="unitValue">Value</label><input type="number" id="unitValue" value="1"><label for="unitFrom">From</label><select id="unitFrom"><option value="m">Meters</option><option value="km">Kilometers</option><option value="ft">Feet</option><option value="mi">Miles</option></select><button onclick="convertUnit()">Convert to All</button></div><pre id="unitResult"></pre>
      </div>

      <div class="nav-links">
        <a href="../index.html">Home</a>
        <a class="secondary" href="index.html">Back to JavaScript Programs</a>
      </div>
    </div>
  </main>

  <footer>JavaScript Programs &mdash; Program 11</footer>
<script>
function convertUnit() {
  const value = parseFloat(document.getElementById('unitValue').value);
  const from = document.getElementById('unitFrom').value;
  if (isNaN(value)) { document.getElementById('unitResult').textContent = 'Enter a valid number.'; return; }
  const toMeters = { m: 1, km: 1000, ft: 0.3048, mi: 1609.34 };
  const meters = value * toMeters[from];
  const result = {
    meters: meters.toFixed(3),
    kilometers: (meters / 1000).toFixed(3),
    feet: (meters / 0.3048).toFixed(3),
    miles: (meters / 1609.34).toFixed(5)
  };
  document.getElementById('unitResult').textContent = JSON.stringify(result, null, 2);
}
</script>
</body>
</html>
