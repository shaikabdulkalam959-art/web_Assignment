<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Try/Catch Error Handling</title>
<link rel="stylesheet" href="../assets/style.css">

</head>
<body>

  <header class="site-header"><h1>JavaScript Programs</h1></header>

  <main>
    <div class="program-page">
      <h1>65. Try/Catch Error Handling</h1>
      <p class="description">Demonstrates catching runtime errors gracefully using try/catch/finally instead of letting them crash the script.</p>

      <div class="demo-area">
<button onclick="runErrorDemo()">Run Risky Code</button><pre id="errorOutput"></pre>
      </div>

      <div class="nav-links">
        <a href="../index.html">Home</a>
        <a class="secondary" href="index.html">Back to JavaScript Programs</a>
      </div>
    </div>
  </main>

  <footer>JavaScript Programs &mdash; Program 65</footer>
<script>
function riskyOperation() {
  const arr = [1, 2, 3];
  return arr[10].toString(); // this will throw, since arr[10] is undefined
}
function runErrorDemo() {
  const output = document.getElementById('errorOutput');
  try {
    const result = riskyOperation();
    output.textContent = 'Result: ' + result;
  } catch (error) {
    output.textContent = 'Caught an error: ' + error.message;
  } finally {
    output.textContent += '\n(finally block always runs, for cleanup code)';
  }
}
</script>
</body>
</html>
