<script>
const square = n => n * n;
const add = (a, b) => a + b;
const name = 'Shaik', score = 92;
const message = `Hello ${name}, you scored ${score} marks (${score >= 90 ? 'Excellent' : 'Good'}).`;
document.getElementById('arrowOutput').textContent =
`square(5) = ${square(5)}
add(3, 4) = ${add(3, 4)}
Template literal: ${message}`;
</script>
