<script>
const coordinates = [12, 45];
const [x, y] = coordinates;

const student = { name: 'Shaik', course: 'AI/ML', cgpa: 8.28 };
const { name, cgpa } = student;

const [first, , third] = ['a', 'b', 'c']; // skipping an element

document.getElementById('destructOutput').textContent =
`Array destructuring: x=${x}, y=${y}
Object destructuring: name=${name}, cgpa=${cgpa}
Skipping elements: first=${first}, third=${third}`;
</script>
